# Externalized configuration: auto-configured beans read their settings from here
# (and from environment variables, which OVERRIDE this file
# YAML nesting maps to dotted property names: the block below is the property "spring.application.name".
spring:
  application:
    name: ledger-lens-backend
  # Loads backend/.env as properties, making PLAID_CLIENT_ID / PLAID_SECRET
  # visible to the placeholders below. "optional:" = don't crash when the file
  # is absent (CI, or a teammate without keys). This is why the secrets live in
  # a gitignored file instead of in this one.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    # 5433, not 5432 — our compose file maps it there (macro-max owns 5432).
    url: jdbc:postgresql://localhost:5433/ledgerlens
    username: ledgerlens
    # Dev-only. Spring config has an override chain: the env var
    # SPRING_DATASOURCE_PASSWORD would beat this file — that's how the real
    # secret stays out of git in production (Step 30).
    password: ledgerlens_dev

  jpa:
    hibernate:
      # validate = Hibernate NEVER touches the schema (schema.sql owns it);
      # it only verifies entities match the tables at startup and fails fast
      # if not. Never use 'update'/'create' against data you care about.
      ddl-auto: validate
    # Off = database sessions end when the service method returns, instead of
    # staying open through view rendering. Best practice; the default (on)
    # mostly exists for old server-rendered apps.
    open-in-view: false

# Actuator exposes many endpoints; over HTTP only "health" is on by default.
# We state it explicitly so the intent is visible in config.
management:
  endpoints:
    web:
      exposure:
        include: health

# Our own custom property (not a Spring one) — read via @Value in the filter.
# ${ENV_VAR:default} = use the environment variable if set, else the default.
# So local dev just works, while production sets LEDGERLENS_API_KEY and this
# file never holds the real secret. Same override chain as the db password.
ledgerlens:
  api-key: ${LEDGERLENS_API_KEY:dev-local-key}
  plaid:
    # Empty default (":" with nothing after it) so the app still STARTS without
    # credentials — Plaid calls then fail with a clear 502 instead of the app
    # refusing to boot. Deliberate: the rest of the API stays usable.
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    # sandbox | development | production. Sandbox = fake banks, fake money,
    # identical API surface — the integration work is the same either way.
    environment: sandbox
