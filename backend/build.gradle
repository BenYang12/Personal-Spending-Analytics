plugins {
    id 'java'
    // The Boot plugin adds tasks like `bootRun` (run the app) and `bootJar`
    // (package app + embedded Tomcat into one executable jar).
    id 'org.springframework.boot' version '4.1.0'
    // Boot publishes a "bill of materials": tested-together versions for
    // hundreds of libraries. This plugin applies it — note that none of the
    // dependencies below carry a version number. Boot picks compatible ones.
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ledgerlens'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // Compile and run against JDK 21 regardless of the machine's default JDK.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Each "starter" is a bundle of libraries + a trigger for auto-configuration.

    // Spring MVC + embedded Tomcat: makes this a web app listening on :8080.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Actuator adds production endpoints (/actuator/health, metrics, info).
    // Real ops teams rely on these; it's also our Step 1 proof of life.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Bean Validation (@NotNull, @Positive...) — used when we accept input later.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // NOTE: no database dependencies yet — deliberately. See Step 4.

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito: creates stand-in ("mock") objects so we can test our sync logic
    // without calling Plaid or touching Postgres. Version omitted — Boot's BOM
    // picks one compatible with its JUnit.
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // JPA starter: pulls in Hibernate + Spring Data and TRIGGERS the
    // auto-configuration that builds a DataSource (connection pool) and
    // EntityManager at startup. This is why we waited until Postgres existed.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // The Postgres JDBC driver. runtimeOnly: our code never imports it —
    // Hibernate speaks to it through the JDBC interface at runtime.
    runtimeOnly 'org.postgresql:postgresql'

    // Token-bucket rate limiting. Plain library, not a Spring starter — so
    // there's no auto-configuration: we wire it ourselves in the filter.
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // The official Anthropic Java SDK, for my advice layer.
    // Worth knowing: this pulls in Jackson 2 (com.fasterxml.jackson.*) while
    // Spring Boot 4 uses Jackson 3 (tools.jackson.*). They coexist fine —
    // different package names entirely — but it does mean two Jackson versions
    // on my classpath, and the annotations on my structured-output record are
    // Jackson 2's while my Spring DTOs use Jackson 3's.
    implementation 'com.anthropic:anthropic-java:2.39.0'

    // Plaid's official Java SDK (Retrofit-based HTTP client for their API).
    implementation 'com.plaid:plaid-java:35.0.0'


}

tasks.named('test') {
    useJUnitPlatform()   // run tests with JUnit 5
}
